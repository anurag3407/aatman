services:
  - type: web
    name: aatman
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: "https://aatman.sayalabs.in"
      - key: DATABASE_URL
        sync: false # e.g. postgresql://postgres.iumwvzqnvmgvvplbwnva:...@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres
      - key: DEV_LOGIN
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: PSEUDONYM_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false # 32-byte base64 key
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: "nitp.ac.in,sayalabs.in"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: COUNSELLOR_EMAILS
        value: "counsellor@nitp.ac.in"
      - key: ADMIN_EMAILS
        value: "admin@nitp.ac.in"
      - key: LLM_PROVIDER
        value: "openai_compat"
      - key: LLM_MODEL
        value: "deepseek-ai/DeepSeek-V4.1-Flash"
      - key: OPENAI_COMPAT_BASE_URL
        value: "https://api.river.ai/v1"
      - key: OPENAI_COMPAT_API_KEY
        sync: false
